apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gitlfscache
  labels:
    app.kubernetes.io/name: gitlfscache
  annotations:
    # These four are load bearing, and every one of them fails quietly if it is missing.
    #
    # Nginx buffers request bodies to disk by default, which defeats the streaming upload tee and caps
    # object size at whatever the controller is willing to buffer. Turning buffering off and lifting
    # the body size limit is what lets a large push stream through.
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    # A large object legitimately takes minutes to transfer. The default timeouts cut it off partway,
    # which surfaces as an intermittently failing clone rather than an obvious misconfiguration.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  # These annotations are nginx-specific. A different ingress controller needs its own equivalents,
  # and the failure mode if they are missed is silent: small objects work, large ones fail at whatever
  # size the controller buffers to.
  ingressClassName: nginx
  rules:
    - host: lfs-cache.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gitlfscache
                port:
                  name: http
