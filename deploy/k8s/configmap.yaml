apiVersion: v1
kind: ConfigMap
metadata:
  name: gitlfscache-config
  labels:
    app.kubernetes.io/name: gitlfscache
data:
  # Double underscore is the environment-variable form of a configuration section separator, so these
  # map onto the same options the appsettings file binds.
  # Set to "false" for a metadata-only deployment: no store, no volume, no eviction, and object
  # transfers relayed straight to upstream. Every setting below under Store is then ignored.
  GitLfsCache__Store__Enabled: "true"

  GitLfsCache__Store__MaxSize: 50GB
  GitLfsCache__Store__LowWaterMark: "0.9"
  GitLfsCache__Store__StagingMaxAge: "06:00:00"
  GitLfsCache__Store__MaintenanceInterval: "00:05:00"
  GitLfsCache__TokenLifetime: "01:00:00"
  GitLfsCache__Fetch__FollowerTimeout: "00:05:00"

  # Lock listings are cached for this long. Short deliberately: it is the only thing bounding how long
  # a lock taken outside the proxy, through a forge's web interface, stays invisible here. Admission
  # is how long an upstream authorization is trusted, and must be at least the listing lifetime.
  GitLfsCache__Locks__ListTtl: "00:00:15"
  GitLfsCache__Locks__AdmissionTtl: "00:01:00"

  # How many lock calls a batched request may have in flight against one upstream, across every
  # request in this process. Raise it only while watching the throttled-items counter.
  GitLfsCache__Locks__MaxFanOutConcurrency: "8"

  # The URL clients use. Leave it unset to derive each transfer URL from the incoming request, which
  # requires the ingress to send X-Forwarded-Proto and X-Forwarded-Host. Setting it explicitly is the
  # safer choice, because only the operator knows for certain what clients addressed.
  GitLfsCache__PublicBaseUrl: https://lfs-cache.example.com

  # One entry per upstream. The key is the first path segment clients address, so this upstream is
  # reached at https://lfs-cache.example.com/github/<owner>/<repo>.git/info/lfs
  GitLfsCache__Upstreams__github__BaseUrl: https://github.com

  # Required: which repository paths this upstream may be used for. Matched against the whole path
  # after the upstream key, so an entry normally ends in ** because that path continues into
  # info/lfs/objects/batch and the like. Narrow this to the repositories the cache is deployed for:
  # left open, any caller who can reach the proxy can displace the working set with traffic it was
  # not sized for. "**" allows everything.
  GitLfsCache__Upstreams__github__Repositories__0: studio/**
