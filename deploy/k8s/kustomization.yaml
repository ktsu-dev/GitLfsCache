apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# includeSelectors is off on purpose: the selectors in the manifests are written out explicitly, and
# letting kustomize rewrite them means a label change silently orphans running pods.
labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/name: gitlfscache
      app.kubernetes.io/component: cache

resources:
  - configmap.yaml
  - service.yaml
  - statefulset.yaml
  - ingress.yaml

# The token key is deliberately not in this base. It protects rewritten transfer URLs and carries an
# upstream credential, so it belongs in a real secret store rather than in a file next to the
# manifests. Generate one with:
#
#   kubectl create secret generic gitlfscache-tokens \
#     --from-literal=tokenKey="$(head -c 32 /dev/urandom | base64)"
#
# To rotate without breaking transfers already in flight, add the new key as TokenKeys__0 and keep the
# old one as TokenKeys__1 until the old token lifetime has elapsed, then drop it.
